<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; margin: 0; }
  body { background: #010309; overflow: hidden; display: grid; place-items: center; }
  .frame { position: relative; width: 100%; height: 100%; overflow: hidden;
           background: radial-gradient(ellipse 80% 85% at 50% 36%, #10266b 0%, #0a1740 30%, #050b1e 65%, #01030b 95%); }

  .god { animation: breath 10s ease-in-out infinite; transform-origin: 960px 1200px; }
  @keyframes breath { 0%,100% { transform: scale(1); } 50% { transform: scale(1.005); } }

  .orbit { animation: orbit 14s linear infinite; }
  .orbit.slow { animation-duration: 22s; animation-direction: reverse; }
  @keyframes orbit { to { stroke-dashoffset: -1200; } }

  .aura { animation: aura 8s ease-in-out infinite; }
  @keyframes aura { 0%,100% { opacity: .8; } 50% { opacity: 1; } }

  .eyes { transform-box: fill-box; transform-origin: center; animation: blink 16s infinite; }
  @keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 97.5% { transform: scaleY(.06); } }
  .eye-pulse { animation: epulse 5s ease-in-out infinite; }
  @keyframes epulse { 0%,100% { opacity: .75; } 50% { opacity: 1; } }

  .fog1 { animation: drift 40s linear infinite; }
  .fog2 { animation: drift 60s linear infinite reverse; }
  @keyframes drift { from { transform: translateX(-200px); } to { transform: translateX(200px); } }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ns = 'http://www.w3.org/2000/svg';

  const starG = document.getElementById('stars');
  for (let i = 0; i < 140; i++) {
    const x = Math.random() * 1920, y = Math.random() * 640;
    const edge = Math.min(x, 1920 - x) < 260 ? .35 : 1;
    const st = document.createElementNS(ns, 'circle');
    st.setAttribute('cx', x.toFixed(1)); st.setAttribute('cy', y.toFixed(1));
    st.setAttribute('r', (Math.random() * 1.1 + .3).toFixed(2));
    st.setAttribute('opacity', ((Math.random() * .5 + .1) * edge).toFixed(2));
    starG.appendChild(st);
  }

  const c = document.getElementById('particles');
  const ctx = c.getContext('2d');
  let W, H, motes = [];
  function size() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = c.clientWidth; H = c.clientHeight;
    c.width = W * dpr; c.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function mote(init) {
    const isGold = Math.random() < 0.2;
    return { 
      x: Math.random() * W, 
      y: init ? Math.random() * H : H + 10, 
      r: Math.random() * 2.2 + 0.6,
      vy: -(Math.random() * 0.35 + 0.08), 
      vx: (Math.random() - 0.5) * 0.12, 
      a: Math.random() * 0.7 + 0.3, 
      t: Math.random() * 6.28,
      color: isGold ? '251,191,36' : '0,240,255'
    };
  }
  size(); addEventListener('resize', size);
  for (let i = 0; i < 150; i++) motes.push(mote(true));
  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (const m of motes) {
      m.t += 0.012; m.y += m.vy; m.x += m.vx + Math.sin(m.t) * 0.15;
      if (m.y < -10) Object.assign(m, mote(false));
      ctx.beginPath();
      ctx.fillStyle = `rgba(${m.color},${m.a * (0.6 + 0.4 * Math.sin(m.t * 3))})`;
      ctx.shadowColor = `rgba(${m.color},0.95)`; ctx.shadowBlur = 10;
      ctx.arc(m.x, m.y, m.r, 0, 6.28); ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  if (!reduce) tick();

  const bolts = document.getElementById('bolts');
  function bolt() {
    const side = Math.random() < .5 ? -1 : 1;
    let x = 960 + side * (180 + Math.random() * 220), y = 100 + Math.random() * 220;
    let d = `M${x} ${y}`;
    const steps = 7 + Math.floor(Math.random() * 6);
    for (let i = 0; i < steps; i++) { x += (Math.random() - .5) * 60 + side * 8; y += 30 + Math.random() * 40; d += ` L${x.toFixed(1)} ${y.toFixed(1)}`; }
    const p = document.createElementNS(ns, 'path');
    p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke', '#00f0ff');
    p.setAttribute('stroke-width', (Math.random() * 2 + 1.8).toFixed(1)); p.setAttribute('opacity', '0');
    p.setAttribute('filter', 'url(#bloom)');
    bolts.appendChild(p);
    [.9, .3, .7, 0].forEach((o, i) => setTimeout(() => p.setAttribute('opacity', o), i * 65));
    setTimeout(() => p.remove(), 450);
    setTimeout(bolt, 1200 + Math.random() * 3000);
  }
  if (!reduce) setTimeout(bolt, 1000);
})();
</script>
